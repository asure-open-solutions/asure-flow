[project]
name = "asure-flow-server"
version = "0.1.0"
description = "Asuré Flow — real-time conversation assistant server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "faster-whisper>=1.1.0",
    "litellm>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "duckduckgo-search>=7.0.0",
]

[project.optional-dependencies]
audio-capture = [
    "sounddevice>=0.5.0",
]
diarization = [
    "pyannote.audio>=3.3.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
search = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asure_flow"]
